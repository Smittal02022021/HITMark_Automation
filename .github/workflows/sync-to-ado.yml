name: Sync GitHub to Azure DevOps

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "github-actions@github.com"

      - name: Add Azure DevOps Remote
        env:
          AZURE_DEVOPS_PAT: ${{ secrets.PERSONAL_AZURE_DEVOPS_PAT }}
          AZURE_DEVOPS_REPO: ${{ secrets.PERSONAL_AZURE_DEVOPS_REPO }}
        run: |
          REPO_URL=$(echo "$AZURE_DEVOPS_REPO" | sed "s#https://#https://:${AZURE_DEVOPS_PAT}@#")
          git remote add ado "$REPO_URL"

      - name: Push to Azure DevOps
        run: |
          git push ado main